<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Studium General Mahasiswa</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header class="header">
            <h1>Pendaftaran Studium General Mahasiswa</h1>
            <p>Silakan isi form pendaftaran di bawah ini.</p>
        </header>

        <main class="card">

            <h2>Form Pendaftaran</h2>

            <form action="detail.html" method="GET">

                <div class="form-group">
                    <label for="nama">Nama Lengkap</label>
                    <input type="text" id="nama" name="nama"
                           placeholder="Masukkan nama lengkap"
                           required>
                </div>

                <div class="form-group">
                    <label for="nim">NIM</label>
                    <input type="text" id="nim" name="nim"
                           placeholder="Masukkan NIM"
                           required>
                </div>

                <div class="form-group">
                    <label for="prodi">Program Studi</label>

                    <select id="prodi" name="prodi">
                        <option value="Teknik Informatika">
                            Teknik Informatika
                        </option>

                        <option value="Sistem Informasi">
                            Sistem Informasi
                        </option>

                        <option value="Teknik Elektro">
                            Teknik Elektro
                        </option>

                        <option value="Teknik Sipil">
                            Teknik Sipil
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>

                    <input type="email" id="email" name="email"
                           placeholder="contoh@email.com"
                           required>
                </div>

                <div class="form-group">
                    <label for="alamat">Alamat</label>

                    <textarea id="alamat" name="alamat"
                              placeholder="Masukkan alamat"></textarea>
                </div>

                <button type="submit">
                    Daftar
                </button>

            </form>

        </main>

        <footer>
            <p>Tugas Individu 3 - Pemrograman Web</p>
        </footer>

    </div>

</body>
</html>
